<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulado de Certificações SAP — Dexterity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ow:#F7F3E7;--gf:#4D4D4D;--ce:#009994;--rx:#98569A;--am:#FFA436;--mg:#597C59;--err:#C0504A;--line:#e7e0cf;--mut:#8a8478;}
*{box-sizing:border-box}
body{margin:0;background:var(--ow);color:var(--gf);font-family:'Mulish','Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.ttl{font-family:'Saira Condensed','Oswald','Arial Narrow',sans-serif;letter-spacing:.4px;text-transform:uppercase}
.wrap{max-width:1080px;margin:0 auto;padding:24px 20px 72px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px}
.soft{box-shadow:0 1px 2px rgba(77,77,77,.06),0 8px 24px rgba(77,77,77,.05)}
.btn{cursor:pointer;border:none;border-radius:10px;font-weight:700;font-size:14px;font-family:inherit;transition:filter .15s,transform .08s;padding:11px 18px}
.btn:hover{filter:brightness(1.05)} .btn:active{transform:translateY(1px)}
.btn-pri{background:var(--ce);color:#fff} .btn-acc{background:var(--am);color:#fff}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--gf)}
.btn-danger{background:#fff;border:1px solid #f0d6d4;color:var(--err)}
.btn:disabled{background:#cdd6d5;color:#fff;cursor:default;filter:none}
.row{display:flex;align-items:center} .between{justify-content:space-between} .gap{gap:10px} .wrapf{flex-wrap:wrap}
.grid{display:grid;gap:14px}
.kpi{padding:16px} .kpi .lab{font-size:12.5px;font-weight:600;color:var(--mut)} .kpi .val{font-size:30px;margin-top:6px} 
.chip{cursor:pointer;border-radius:999px;font-weight:600;font-size:13px;padding:8px 14px;border:1.5px solid var(--line);background:#fff;color:var(--gf);font-family:inherit}
.chip.on{color:#fff}
.badge{display:inline-block;font-size:11.5px;font-weight:700;color:#fff;padding:4px 10px;border-radius:999px}
.nav{background:#fff;border-bottom:1px solid var(--line)}
.navin{max-width:1080px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.navbtn{cursor:pointer;border:none;background:transparent;border-radius:10px;font-weight:600;font-size:14px;padding:8px 14px;color:var(--gf);font-family:inherit}
.navbtn.on{background:var(--ce);color:#fff}
.opt{display:flex;align-items:flex-start;gap:12px;text-align:left;padding:13px 15px;border-radius:12px;border:1.5px solid var(--line);background:#fff;cursor:pointer;width:100%;font-family:inherit;font-size:14.5px;line-height:1.45;color:var(--gf);transition:all .12s}
.optl{flex-shrink:0;width:26px;height:26px;border-radius:7px;background:#efe9da;display:flex;align-items:center;justify-content:center;font-size:14px}
.in{padding:11px 13px;border-radius:10px;border:1px solid #ddd5c2;font-size:15px;font-family:inherit;outline:none;background:#fff;color:var(--gf)}
.sec{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);margin-bottom:10px}
.modal{position:fixed;inset:0;background:rgba(77,77,77,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
a.dl{color:var(--ce);font-weight:700;text-decoration:none}
.barbg{height:8px;background:#efe9da;border-radius:999px;overflow:hidden}
.muted{color:var(--mut)} .small{font-size:12px}

</style>
</head>
<body>
<div id="app"></div>
<script>

var C={ow:'#F7F3E7',gf:'#4D4D4D',ce:'#009994',rx:'#98569A',am:'#FFA436',mg:'#597C59',err:'#C0504A'};
var CATS_CACT = {
  agile:      { label: 'Ágil e Scrum',              color: C.ce },
  phases:     { label: 'Fases do Activate',          color: C.rx },
  fts:        { label: 'Fit-to-Standard',            color: C.am },
  transition: { label: 'Caminhos de Transição',      color: C.mg },
  cloud:      { label: 'Edições Cloud e Deploy',     color: '#2F8F8C' },
  tools:      { label: 'Ferramentas e Aceleradores', color: '#7A4480' },
  testing:    { label: 'Testes',                      color: '#C77F2E' },
  ext:        { label: 'Extensibilidade e Código',    color: '#46663F' },
  method:     { label: 'Metodologia e Governança',    color: '#5C5C5C' },
};;
var CATS_TRM={
  tm:{label:'Transaction Manager',color:C.ce},
  hedge:{label:'Hedge Mgmt & Accounting',color:C.rx},
  mra:{label:'Market Risk Analyzer',color:C.am},
  cra:{label:'Credit Risk Analyzer',color:'#C77F2E'},
  cash:{label:'Cash & Liquidity',color:C.mg},
  bank:{label:'Bancos & Pagamentos',color:'#2F8F8C'},
  bp:{label:'Business Partner',color:'#7A4480'},
  cfin:{label:'Central Finance',color:'#5C5C5C'},
  gen:{label:'S/4HANA & Geral',color:'#46663F'}
};
var Q_CACT = [
  { id:1, cat:'agile', q:'Which estimation technique can you use in an Agile delivery approach to size the user stories during sprint planning?',
    o:{A:'Detailed top-down effort estimate by the Scrum Master in story points, based on the user story complexity',B:'Relative effort estimate in Ideal Person Days that reflects the best estimate by the Project Team',C:"Product Owner's relative effort estimate that will be needed to implement and test the user story",D:'Detailed bottom-up effort estimate by the Product Owner that breaks up each story into short tasks'}, a:['A'],
    e:'A estimativa em story points (top-down) avalia tamanho e complexidade relativos, gerando estimativas por consenso.'},
  { id:2, cat:'agile', q:'What activity do you perform during the daily stand-up meeting?',
    o:{A:'Refine acceptance criteria for the sprint.',B:'Re-baseline the release plan.',C:'Demo completed features.',D:'Report showstoppers.'}, a:['D'],
    e:'A daily foca em alinhamento do time, reportando impedimentos (showstoppers) que travam o progresso.'},
  { id:3, cat:'fts', q:'Which of the following steps are part of the fit-to-standard process?',
    o:{A:'Document integration requirements',B:'Enable customers on standard business processes',C:'Review Best Practices process flow',D:'Design to-be business process models'}, a:['B','C'],
    e:'O fit-to-standard inclui capacitar o cliente nos processos padrão e revisar os fluxos das Best Practices.'},
  { id:4, cat:'fts', q:'What accelerator can help you document the configuration definition in the Explore phase?',
    o:{A:'Change request template',B:'Test plan template',C:'Data definition template',D:'Backlog template'}, a:['D'],
    e:'O Backlog template documenta e rastreia as configurações e requisitos identificados nos workshops do Explore.'},
  { id:5, cat:'tools', q:'Which of the following tools can support you in managing requirements and software development for implementation projects?',
    o:{A:'SAP Focused Run',B:'Focused Build for SAP Solution Manager',C:'SAP Cloud ALM',D:'Focused Insights for SAP Solution Manager'}, a:['B','C'],
    e:'Focused Build e SAP Cloud ALM gerenciam requisitos e o desenvolvimento de software em projetos de implementação.'},
  { id:6, cat:'tools', q:'Which collaboration features are available in the SAP Community?',
    o:{A:'Ask questions',B:'Comment on Key Deliverables',C:'Update Key Deliverable wikis',D:'Follow community'}, a:['A','D'],
    e:'Na SAP Community é possível fazer perguntas e seguir tópicos/comunidades.'},
  { id:7, cat:'cloud', q:"Which of the following is the customer's responsibility in both on-premise and private cloud scenarios?",
    o:{A:'Database',B:'Operating system',C:'Middleware',D:'Servers'}, a:['D'],
    e:'Em on-premise e private cloud, a manutenção dos servidores (físicos ou virtuais) é responsabilidade do cliente.'},
  { id:8, cat:'phases', q:"In which phase do you verify the SAP Best Practices content that meets the customer's business needs, and capture delta requirements?",
    o:{A:'Discovery',B:'Explore',C:'Prepare',D:'Realize'}, a:['B'],
    e:'No Explore o conteúdo das Best Practices é validado e os requisitos delta são capturados.'},
  { id:9, cat:'ext', q:'What does the Side-by-Side extensibility option mean?',
    o:{A:'SAP S/4HANA extensions are context-aware and focused on tight integration.',B:'There are two SAP S/4HANA instances: one for standard code and another for custom developments.',C:'Extend SAP S/4HANA using APIs published on SAP Business Accelerator Hub.',D:'Extending SAP S/4HANA using SAP ABAP Development Workbench.'}, a:['C'],
    e:'Side-by-Side estende o S/4HANA via APIs e serviços no SAP Business Accelerator Hub, desacoplando customizações do core.'},
  { id:10, cat:'method', q:'Which of the following are levels in the structure of an SAP Best Practices for SAP S/4HANA Solution Package?',
    o:{A:'Scope Items',B:'Business Process Scenarios',C:'Configuration Guides',D:'Building Blocks'}, a:['A','D'],
    e:'Scope Items e Building Blocks são níveis estruturais do Solution Package.'},
  { id:11, cat:'method', q:'In which workstream do you execute an organizational change impact analysis?',
    o:{A:'Application Design and Configuration',B:'Solution Adoption',C:'Analytics',D:'Project Management'}, a:['B'],
    e:'A análise de impacto da mudança organizacional ocorre na workstream Solution Adoption.'},
  { id:12, cat:'method', q:'What is the most granular level of the methodology you can view in the SAP Roadmap Viewer?',
    o:{A:'Task',B:'Workstream',C:'Deliverable',D:'Activities'}, a:['A'],
    e:'No Roadmap Viewer, Task é o nível mais detalhado e granular.'},
  { id:13, cat:'agile', q:'What is the objective of using scaling Scrum techniques when coordinating large teams in complex projects?',
    o:{A:'To reallocate staff to skill-based teams such as developers in one single team.',B:'To bring all specialists, such as the company legal advisors, into the Scrum team.',C:'To manage the flow of information between the project and stakeholders.',D:'To ensure alignment in architecture, configuration, and integration.'}, a:['D'],
    e:'Técnicas como Scrum of Scrums garantem alinhamento de arquitetura, configuração e integração entre times.'},
  { id:14, cat:'tools', q:'What tool would you use for managing project tasks and Solution Documentation when implementing SAP S/4HANA Cloud, public edition?',
    o:{A:'SAP Cloud ALM',B:'SAP Signavio Process Navigator',C:'SAP Roadmap Viewer',D:'SAP Transformation Navigator'}, a:['A'],
    e:'SAP Cloud ALM gerencia tarefas e a Solution Documentation no S/4HANA Cloud, public edition.'},
  { id:15, cat:'phases', q:'What is one of the key activities performed towards the end of the Explore phase?',
    o:{A:'Setup of Solution Standardization Board',B:'Operations Planning for operational readiness',C:'Installation and setup of Sandbox system',D:'Perform configuration settings in the system'}, a:['A'],
    e:'Ao fim do Explore configura-se o Solution Standardization Board para governança e consistência.'},
  { id:16, cat:'method', q:'Comparing the SAP Activate methodology with Waterfall, what activities are performed by the new project roles?',
    o:{A:'Product owner to discuss schedule with the customer',B:'Scrum master to prepare the project plan',C:'Scrum master and project sponsor to define the project charter',D:'Scrum team to review best practices'}, a:['D'],
    e:'Em abordagens ágeis, o Scrum team revisa e aplica as best practices; os times são auto-organizados.'},
  { id:17, cat:'fts', q:'Which activity helps the project team identify and add user stories to the backlog?',
    o:{A:'Assessing documentation requirements',B:'Benchmarking current business processes',C:'Planning the release and sprints',D:'Conducting the fit-to-standard workshop'}, a:['D'],
    e:'O workshop de fit-to-standard identifica gaps e requisitos, convertidos em user stories no backlog.'},
  { id:18, cat:'agile', q:'Who determines the tasks that are required to complete the committed backlog items in a Sprint?',
    o:{A:'Project manager',B:'Scrum master',C:'Scrum team',D:'Product owner'}, a:['C'],
    e:'O Scrum team se auto-organiza para definir as tarefas necessárias aos itens do backlog.'},
  { id:19, cat:'agile', q:'What information does the project team need before they can correctly estimate the relative size of backlog user stories?',
    o:{A:'Available project resources',B:'Definition of Ready',C:'Definition of Done',D:'Benchmark user story'}, a:['B','C'],
    e:'Definition of Ready e Definition of Done estabelecem critérios claros para estimar com precisão.'},
  { id:20, cat:'agile', q:'How do you set up Scrum teams?',
    o:{A:'As a cross-functional team covering multiple functions, like configuration, data loads, and testing.',B:'By type of work, like configuration Scrum, documentation Scrum, and testing Scrum.',C:'Based on group size, but a minimum of 12 people.',D:'Based on end-to-end processes like order-to-cash.'}, a:['A','D'],
    e:'Times Scrum são cross-functional ou organizados por processos ponta-a-ponta (ex.: order-to-cash).'},
  { id:21, cat:'agile', q:'When does the Scrum team receive formal confirmation that the user stories are completed to the satisfaction of the product owner?',
    o:{A:'During the sprint review',B:'During the sprint retrospective',C:'During the sprint backlog review',D:'During the sprint user acceptance test'}, a:['A'],
    e:'No sprint review o time demonstra as stories e o product owner confirma os critérios de aceite.'},
  { id:22, cat:'tools', q:'Which of the following tools are considered enablers for digital transformation?',
    o:{A:'SAP Product Availability Matrix',B:'SAP Roadmap Viewer',C:'Software Logistics Toolset',D:'SAP Activate Community',E:'SAP Signavio Process Navigator'}, a:['B','D','E'],
    e:'Roadmap Viewer, Activate Community e Signavio Process Navigator apoiam a transformação digital.'},
  { id:23, cat:'phases', q:'You are transitioning to SAP S/4HANA. In which phase do you adjust custom code?',
    o:{A:'Realize',B:'Deploy',C:'Explore',D:'Prepare'}, a:['A'],
    e:'O ajuste de código customizado ocorre no Realize, junto com configuração e desenvolvimento.'},
  { id:24, cat:'cloud', q:'What is the difference between the "New Implementation of SAP S/4HANA Cloud, public edition" and the "New Implementation of SAP S/4HANA, private edition" transition paths?',
    o:{A:'Private edition uses the Implementation Guide (IMG), and public edition uses SAP Central Business Configuration.',B:'Private edition is only available through SAP Cloud services and with embedded implementation services from SAP.',C:'Public edition does NOT offer built-in capabilities for extensibility, while private edition offers a full development environment.',D:'Upgrades of public edition are based on SAP timelines, and upgrades of private edition are based on timelines agreed upon between SAP and the customer.'}, a:['A','D'],
    e:'Public usa CBC e upgrades pela SAP; private usa IMG e upgrades em cronograma acordado.'},
  { id:25, cat:'fts', q:'Which of the following is part of the Explore phase in the "New Implementation of SAP S/4HANA Cloud, public edition" transition path?',
    o:{A:'Request SAP S/4HANA Cloud Development System',B:'Solution Validation and Delta Design',C:'Develop and document Enablement Strategy',D:'Fit-to-standard'}, a:['D'],
    e:'O workshop de fit-to-standard é parte central do Explore no public edition.'},
  { id:26, cat:'agile', q:'What do you do during the sprint retrospective meeting?',
    o:{A:'Define sprint activities and best practices with the customer.',B:'Plan future sprints with the customer.',C:'Discuss best practices with the Scrum Team.',D:'Document best practices guided by the Scrum Master.'}, a:['D'],
    e:'Na retrospectiva, guiada pelo Scrum Master, documentam-se best practices e lições aprendidas.'},
  { id:27, cat:'fts', q:'What findings do you document in the Explore Phase Fit-to-standard workshops?',
    o:{A:'Detailed design of extensions',B:'Process models',C:'Key business decisions',D:'Key user documentation',E:'Confirmation of scope'}, a:['B','C','E'],
    e:'Documentam-se process models, key business decisions e confirmação de escopo.'},
  { id:28, cat:'tools', q:'When performing an SAP Readiness Check in system conversion, what areas are covered within the result?',
    o:{A:'Active business functions',B:'Recommended SAP Fiori apps',C:'SAP and third-party interfaces',D:'Sizing for SAP S/4HANA',E:'Complete list of possible simplification items'}, a:['A','B','E'],
    e:'O Readiness Check cobre business functions ativas, apps Fiori recomendados e simplification items.'},
  { id:29, cat:'phases', q:'When conducting an upgrade of an SAP S/4HANA Cloud, public edition three-system landscape, in which phase are the Business Roles updated?',
    o:{A:'Explore',B:'Deploy',C:'Discover',D:'Realize'}, a:['D'],
    e:'No Realize as Business Roles são atualizadas para a solução upgrade.'},
  { id:30, cat:'transition', q:'What are the two common approaches to Selective Data Transition adopting RISE with SAP?',
    o:{A:'System Conversion',B:'Shell Conversion',C:'Mix and Match',D:'Fit-to-Standard'}, a:['B','C'],
    e:'Shell Conversion (footprint mínimo) e Mix and Match (seleção flexível) são as abordagens de SDT.'},
  { id:31, cat:'cloud', q:'Which of the following is used to perform configuration in SAP S/4HANA Cloud, private edition?',
    o:{A:'SAP Central Business Configuration',B:'Self Service Configuration UIs (SSCUIs)',C:'IMG (Implementation Guide)',D:'SAP Solution Manager'}, a:['C'],
    e:'No private edition a configuração é feita principalmente pelo IMG.'},
  { id:32, cat:'tools', q:'Which additional scope options does the strategic advisory service for cloud analytics offer?',
    o:{A:'SAP S/4HANA for Central Finance',B:'Baseline package',C:'SAP Activate methodology for SAP Datasphere',D:'Extended package'}, a:['B','D'],
    e:'O serviço oferece os pacotes Baseline e Extended.'},
  { id:33, cat:'method', q:'When applying a cloud mindset in a greenfield implementation, which of the following should you consider?',
    o:{A:'Use supported extensibility technologies',B:'Use quality gates',C:'Ensure transparency on deviations',D:'Use SAP Digital Discovery Assessment'}, a:['A','C'],
    e:'Usar tecnologias de extensibilidade suportadas e garantir transparência sobre desvios.'},
  { id:34, cat:'method', q:'Which of the following are levels in the structure of an SAP Best Practices for SAP S/4HANA Solution Package?',
    o:{A:'Business Process Scenarios',B:'Building Blocks',C:'Scope Items',D:'Configuration Guides'}, a:['B','C'],
    e:'Scope Items e Building Blocks compõem a estrutura do Solution Package.'},
  { id:35, cat:'agile', q:'What is the purpose of the scrum board?',
    o:{A:'To show readiness of the release',B:'To visualize the resource load',C:'To visualize team progress',D:'To document the results of the fit-to-standard workshop'}, a:['C'],
    e:'O scrum board visualiza o progresso do time nas tarefas do sprint.'},
  { id:36, cat:'agile', q:'According to the Definition of Done, which activity must be completed for each Sprint?',
    o:{A:'Configuration must be transported to the production system.',B:'Functionality must be released to the business.',C:'Refinement of user story description must be completed.',D:'The solution must be built and configured in the development system.'}, a:['D'],
    e:'A DoD exige que a solução esteja construída e configurada no ambiente de desenvolvimento.'},
  { id:37, cat:'transition', q:'Your customer is using a non-SAP ERP system and decides to deploy SAP S/4HANA. Which of the following options are available to your customer?',
    o:{A:'System Conversion SAP S/4HANA',B:'New Implementation SAP S/4HANA Cloud, private edition',C:'New Implementation SAP S/4HANA',D:'System Conversion SAP S/4HANA Cloud, private edition',E:'New Implementation SAP S/4HANA Cloud, public edition'}, a:['B','C','E'],
    e:'Vindo de ERP não-SAP, apenas caminhos de New Implementation se aplicam.'},
  { id:38, cat:'method', q:'Which of the following considerations apply when determining the project methodology?',
    o:{A:'Readiness fit',B:'Organizational fit',C:'Integration fit',D:'Project fit',E:'Project Manager fit'}, a:['B','C','D'],
    e:'Organizational fit, integration fit e project fit orientam a escolha da metodologia.'},
  { id:39, cat:'cloud', q:'Which system tenant is the first to be provisioned when implementing SAP S/4HANA Cloud, public edition?',
    o:{A:'SAP Cloud Identity Services',B:'SAP S/4HANA Cloud Sandbox system',C:'SAP S/4HANA Cloud Development system',D:'Central Business Configuration system'}, a:['D'],
    e:'O Central Business Configuration system é o primeiro tenant provisionado.'},
  { id:40, cat:'transition', q:'A customer with an existing SAP S/4HANA solution is exploring the best approach to move without changing their landscape into the cloud. Which is the most suitable option for the customer?',
    o:{A:'Selective Data Transition',B:'System Conversion',C:'Mix and Match',D:'Lift and Shift'}, a:['D'],
    e:'Lift and Shift move o sistema existente para a cloud com mínima alteração no landscape.'},
  { id:41, cat:'phases', q:'In which phase will the customer develop a preliminary strategy for building a target Operations and Support organizational model?',
    o:{A:'Prepare',B:'Explore',C:'Discover',D:'Realize'}, a:['A'],
    e:'No Prepare desenvolve-se a estratégia preliminar de Operations and Support.'},
  { id:42, cat:'agile', q:'What technique helps a Scrum team to prioritize a large, flat backlog?',
    o:{A:'Splitting the backlog into epics',B:'MOSCOW prioritization',C:'A/B testing user stories',D:'User story mapping'}, a:['A','D'],
    e:'Dividir em epics e user story mapping organizam e clareiam a priorização.'},
  { id:43, cat:'fts', q:'Which steps should you perform while preparing for a fit-to-standard analysis in an SAP Data Warehouse Cloud project?',
    o:{A:'Review SAP S/4HANA Cloud best practices availability for your country.',B:'Review Cutover Plan accelerator in the Data Management workstream.',C:'Review all the necessary Implementation Design Principles (IDPs).',D:'Review all the necessary leading practice process diagrams.'}, a:['C','D'],
    e:'Revisar os IDPs e os leading practice process diagrams alinha o design às boas práticas.'},
  { id:44, cat:'agile', q:'What criteria does the Scrum team use to sequence the product backlog?',
    o:{A:'Length of the sprint',B:'Business priority',C:'Experience of team members',D:'Technical dependencies'}, a:['B','D'],
    e:'Prioridade de negócio e dependências técnicas ordenam o backlog.'},
  { id:45, cat:'cloud', q:'For which of the following products do you find a specific set of SAP Best Practices for the public sector?',
    o:{A:'SAP S/4HANA',B:'SAP SuccessFactors Employee Central',C:'SAP S/4HANA Cloud, public edition',D:'SAP Ariba Supplier Management'}, a:['C'],
    e:'O S/4HANA Cloud, public edition possui Best Practices específicas para o setor público.'},
  { id:46, cat:'agile', q:'Which of the following is a key characteristic of the Agile project approach?',
    o:{A:'Higher business involvement in the early phases',B:'Frequent and detailed release scheduling',C:'Iterative build with frequent inspections',D:'Frequent quality gates in each sprint'}, a:['C'],
    e:'A construção iterativa com inspeções frequentes é característica central do Agile.'},
  { id:47, cat:'transition', q:'What is the preferred option to migrate to SAP S/4HANA Cloud, private edition while keeping most of the original processes and adding new configuration?',
    o:{A:'Mix and Match',B:'System Conversion',C:'Shell Conversion',D:'New Implementation'}, a:['C'],
    e:'Shell Conversion traz a maioria dos processos originais e permite nova configuração.'},
  { id:48, cat:'agile', q:'What are the responsibilities of the product owner in release and sprint planning?',
    o:{A:'Estimate the backlog user stories.',B:'Define objectives for each release.',C:'Analyze the functional and technical dependencies between user stories.',D:'Prioritize backlog user stories by business priority.'}, a:['B','D'],
    e:'O PO define objetivos de release e prioriza o backlog por prioridade de negócio.'},
  { id:49, cat:'fts', q:'Which accelerators support the fit-to-standard workshop in the Explore phase?',
    o:{A:'Quality gate checklist and quality gate guide',B:'Business-Driven Configuration questionnaire',C:'Test plan document',D:'Requirements feature in SAP Cloud ALM'}, a:['B','D'],
    e:'O questionário Business-Driven Configuration e a feature Requirements do Cloud ALM apoiam o workshop.'},
  { id:50, cat:'tools', q:'Which of the following cloud services are available on SAP Business Technology Platform?',
    o:{A:'SAP Integration Suite',B:'SAP HANA Cloud',C:'SAP Cloud ALM',D:'SAP Data Migration Cockpit',E:'SAP Master Data Governance'}, a:['A','B','E'],
    e:'Integration Suite, HANA Cloud e Master Data Governance estão na BTP.'},
  { id:51, cat:'ext', q:'Which of the following tools facilitate secure communication between SAP cloud solutions and protected on-premise networks that CANNOT be accessed directly from the Internet?',
    o:{A:'Identity Authentication service',B:'SAP Build Code',C:'SAP BTP Connectivity service',D:'Cloud Integration Automation service'}, a:['C'],
    e:'O BTP Connectivity service conecta soluções cloud a redes on-premise isoladas com segurança.'},
  { id:52, cat:'cloud', q:'Which systems are part of the private cloud edition landscape?',
    o:{A:'Starter',B:'Sandbox',C:'Evaluation',D:'Production'}, a:['B','D'],
    e:'Sandbox e Production compõem o landscape do private cloud edition.'},
  { id:53, cat:'tools', q:'Which of the following Accelerators can you find in the SAP Signavio Process Navigator?',
    o:{A:'Process Diagram',B:'Data Migration plan',C:'Test Script',D:'Stakeholder Identification Guide'}, a:['A','C'],
    e:'O Signavio Process Navigator oferece Process Diagrams e Test Scripts.'},
  { id:54, cat:'cloud', q:'Which of the following characteristics are mandatory with SAP S/4HANA Cloud, public edition?',
    o:{A:'Software upgrades performed by SAP',B:'Customer data center deployment',C:'Activation of SAP Best Practices',D:'Choice of hardware vendor'}, a:['A','C'],
    e:'Upgrades pela SAP e ativação das SAP Best Practices são obrigatórios no public edition.'},

<script>
/* ============ Simulado de Certificações SAP — Dexterity ============ */
var MEM={};
function lsGet(k){try{var v=localStorage.getItem(k);return v;}catch(e){return (k in MEM)?MEM[k]:null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){MEM[k]=v;}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){delete MEM[k];}}
function jget(k,d){var v=lsGet(k);if(v==null)return d;try{return JSON.parse(v);}catch(e){return d;}}
function jset(k,o){lsSet(k,JSON.stringify(o));}

var PROFILE_K="sim_profile_v1",SESS_K="sim_sessions_v1",CUSTOM_K="sim_custom_exams_v1";
var ADMIN_PASS="dexterity"; /* altere a senha do modo admin aqui */

var profile=jget(PROFILE_K,null);
var state={view:"home",examCode:null,cfg:null,lastResult:null,adminMsg:""};
var quiz=null,adminUnlocked=false;

function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function sameSet(a,b){if(a.length!==b.length)return false;var x=a.slice().sort().join(),y=b.slice().sort().join();return x===y;}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function pctOf(c,t){return t?Math.round(c/t*100):0;}
function fmtDate(iso){var d=new Date(iso);return ("0"+d.getDate()).slice(-2)+"/"+("0"+(d.getMonth()+1)).slice(-2);}
function fmtDT(iso){var d=new Date(iso);return d.toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});}
function fmtDur(ms){var s=Math.round(ms/1000),m=Math.floor(s/60);return m+"m "+(s%60)+"s";}

function customExams(){return jget(CUSTOM_K,[]);}
function allExams(){return BUILTIN_EXAMS.concat(customExams());}
function getExam(c){return allExams().filter(function(e){return e.code===c;})[0];}
function catInfo(ex,k){return (ex.cats&&ex.cats[k])||{label:k,color:"#888"};}
function allSessions(){return jget(SESS_K,{});}
function examSessions(c){return allSessions()[c]||[];}
function saveSession(c,s){var a=allSessions();(a[c]=a[c]||[]).push(s);jset(SESS_K,a);}
function clearSessions(c){var a=allSessions();delete a[c];jset(SESS_K,a);}

function statsFor(c){var ex=getExam(c),m={};ex.questions.forEach(function(q){m[q.id]={attempts:0,correct:0,last:null};});
  examSessions(c).forEach(function(se){se.items.forEach(function(it){var x=m[it.qid];if(!x)return;x.attempts++;if(it.correct)x.correct++;x.last=it.correct;});});return m;}
function examAccuracy(c){var t=0,cc=0;examSessions(c).forEach(function(se){t+=se.count;cc+=se.items.filter(function(i){return i.correct;}).length;});return {t:t,c:cc,pct:pctOf(cc,t)};}

/* ---------------- render ---------------- */
function $(id){return document.getElementById(id);}
function render(){document.getElementById("app").innerHTML=(!profile?onboarding():topbar()+'<div class="wrap">'+viewBody()+'</div>');}
function go(v){state.view=v;render();}
function openExam(c){state.examCode=c;state.view="examHome";render();}

function viewBody(){
  switch(state.view){
    case "home":return homeV();
    case "examHome":return examHomeV();
    case "setup":return setupV();
    case "quiz":return quizV();
    case "results":return resultsV();
    case "reports":return reportsV();
    case "admin":return adminV();
    default:return homeV();
  }
}

function topbar(){
  var n=function(id,lab){return '<button class="navbtn '+(state.view===id?"on":"")+'" onclick="go(\''+id+'\')">'+lab+'</button>';};
  var rel = state.examCode? '<button class="navbtn '+(state.view==="reports"?"on":"")+'" onclick="go(\'reports\')">Relatórios</button>':'';
  return '<div class="nav"><div class="navin">'+
    '<div class="row gap" style="cursor:pointer" onclick="go(\'home\')"><div style="width:34px;height:34px;border-radius:9px;background:var(--ce);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800" class="ttl">S</div><span class="ttl" style="font-size:21px">Simulado SAP</span></div>'+
    '<div class="row" style="gap:4px">'+n("home","Início")+rel+n("admin","Admin")+
    '<span class="row gap" style="margin-left:8px;padding:6px 12px;border-radius:999px;background:var(--ow);font-size:13px;font-weight:600"><span style="color:var(--rx)">●</span>'+esc(profile.name)+'</span></div>'+
    '</div></div>';
}

/* ---------------- onboarding ---------------- */
function onboarding(){
  return '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px">'+
   '<div class="card soft" style="max-width:440px;width:100%;padding:32px">'+
   '<div class="ttl" style="width:44px;height:44px;border-radius:12px;background:var(--ce);color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;margin-bottom:16px">S</div>'+
   '<h1 class="ttl" style="font-size:30px;margin:0 0 6px">Simulado SAP</h1>'+
   '<p class="muted" style="margin:0 0 20px;font-size:14px">Crie seu perfil. Seu progresso fica salvo neste navegador e é separado por certificação.</p>'+
   '<label class="small" style="font-weight:600">Seu nome</label>'+
   '<input id="onbName" class="in" style="width:100%;margin:6px 0 18px" placeholder="Ex.: Diego" onkeydown="if(event.key===\'Enter\')saveProfile()">'+
   '<button class="btn btn-pri" style="width:100%" onclick="saveProfile()">Começar</button>'+
   '</div></div>';
}
function saveProfile(){var v=($("onbName").value||"").trim();if(!v)return;profile={name:v,createdAt:new Date().toISOString()};jset(PROFILE_K,profile);render();}

/* ---------------- home (exam picker) ---------------- */
function homeV(){
  var cards=allExams().map(function(ex){
    var acc=examAccuracy(ex.code), ns=examSessions(ex.code).length, custom=customExams().some(function(c){return c.code===ex.code;});
    return '<button class="card soft btn-ghost" style="text-align:left;padding:18px;border-radius:16px" onclick="openExam(\''+ex.code+'\')">'+
      '<div class="row between"><span class="ttl" style="font-size:19px">'+esc(ex.title)+'</span>'+(custom?'<span class="badge" style="background:var(--rx)">Custom</span>':'')+'</div>'+
      '<div class="muted small" style="margin-top:2px">'+esc(ex.subtitle||"")+'</div>'+
      '<div class="row between" style="margin-top:14px"><span class="muted small">'+ex.questions.length+' questões</span>'+
      '<span class="small" style="font-weight:700;color:var(--ce)">'+(ns?acc.pct+"% · "+ns+" simulado(s)":"sem histórico")+'</span></div>'+
      '</button>';
  }).join("");
  return '<h2 class="ttl" style="font-size:26px;margin:4px 0 2px">Olá, '+esc(profile.name)+'</h2>'+
    '<p class="muted" style="margin-top:0">Escolha uma certificação para praticar.</p>'+
    '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr));margin-top:14px">'+cards+'</div>';
}

/* ---------------- exam home ---------------- */
function examHomeV(){

/* ---------------- setup ---------------- */
function buildPool(ex,cfg){
  var st=statsFor(ex.code);
  var pool=ex.questions.filter(function(q){return cfg.cats.indexOf(q.cat)>=0;});
  if(cfg.source==="weak"){pool=pool.slice().sort(function(a,b){var sa=st[a.id],sb=st[b.id];var ra=sa.attempts?sa.correct/sa.attempts:2,rb=sb.attempts?sb.correct/sb.attempts:2;return ra-rb;});}
  else if(cfg.source==="wrong"){pool=pool.filter(function(q){return st[q.id].attempts>0&&st[q.id].last===false;});}
  else if(cfg.source==="unseen"){pool=pool.filter(function(q){return st[q.id].attempts===0;});}
  if(cfg.shuffle&&cfg.source!=="weak")pool=shuffle(pool);
  return pool;
}

/* ---------------- charts ---------------- */
function lineChart(pts){
  if(!pts.length)return"";var W=600,H=200,pl=34,pb=24,pt=12,pr=12,plotW=W-pl-pr,plotH=H-pt-pb;
  var n=pts.length, xs=function(i){return pl+(n===1?plotW/2:plotW*i/(n-1));}, ys=function(v){return pt+(1-v/100)*plotH;};
  var grid=[0,50,100].map(function(g){var y=ys(g);return '<line x1="'+pl+'" y1="'+y+'" x2="'+(W-pr)+'" y2="'+y+'" stroke="#eee6d6"/><text x="'+(pl-6)+'" y="'+(y+4)+'" font-size="10" fill="#9b958a" text-anchor="end">'+g+'</text>';}).join("");
  var poly=pts.map(function(p,i){return xs(i)+","+ys(p.v);}).join(" ");
  var dots=pts.map(function(p,i){return '<circle cx="'+xs(i)+'" cy="'+ys(p.v)+'" r="3" fill="var(--ce)"/>';}).join("");
  var labs=pts.map(function(p,i){return (n>12&&i%2)?"":'<text x="'+xs(i)+'" y="'+(H-6)+'" font-size="9" fill="#9b958a" text-anchor="middle">'+p.label+'</text>';}).join("");
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">'+grid+'<polyline points="'+poly+'" fill="none" stroke="var(--ce)" stroke-width="2.5"/>'+dots+labs+'</svg>';
}
function barsH(items){
  if(!items.length)return"";var rh=34,W=600,lw=160,pad=8,bw=W-lw-46,H=items.length*rh+pad;
  var rows=items.map(function(it,i){var y=pad+i*rh,w=bw*it.v/100;return '<text x="0" y="'+(y+rh/2+4)+'" font-size="11" fill="#6f6a5f">'+esc(it.label.length>26?it.label.slice(0,24)+"…":it.label)+'</text>'+
    '<rect x="'+lw+'" y="'+(y+6)+'" width="'+bw+'" height="'+(rh-14)+'" rx="5" fill="#efe9da"/>'+
    '<rect x="'+lw+'" y="'+(y+6)+'" width="'+Math.max(2,w)+'" height="'+(rh-14)+'" rx="5" fill="'+it.color+'"/>'+
    '<text x="'+(W-2)+'" y="'+(y+rh/2+4)+'" font-size="11" fill="#6f6a5f" text-anchor="end">'+it.v+'%</text>';}).join("");
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">'+rows+'</svg>';
}

  var missHtml=miss.map(function(x){var w=x.s.attempts-x.s.correct;return '<div class="row gap" style="align-items:flex-start;padding:12px;border-radius:10px;background:var(--ow)"><span class="badge" style="background:var(--err);flex-shrink:0">'+w+' erro'+(w>1?"s":"")+'</span><div style="flex:1"><p style="margin:0;font-size:13.5px;line-height:1.4;font-weight:600">'+esc(x.q.q)+'</p><p class="small muted" style="margin:3px 0 0">'+esc(catInfo(ex,x.q.cat).label)+' · '+x.s.correct+'/'+x.s.attempts+' acertos</p></div></div>';}).join("");
  return '<button class="btn btn-ghost" style="margin-bottom:12px" onclick="go(\'examHome\')">← '+esc(ex.title)+'</button>'+
   '<h2 class="ttl" style="font-size:24px;margin:0 0 14px">Relatórios · '+esc(ex.title)+'</h2>'+
   '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">'+kpi("Precisão geral",acc.pct+"%")+kpi("Melhor",best+"%")+kpi("Sequência (dias)",streak)+kpi("Tempo/questão",avg)+kpi("Cobertura",answered+"/"+ex.questions.length)+'</div>'+
   '<div class="card soft" style="padding:20px;margin-top:16px"><h3 class="ttl" style="font-size:18px;margin:0 0 6px">Evolução por simulado</h3>'+line+'</div>'+
   '<div class="card soft" style="padding:20px;margin-top:16px"><h3 class="ttl" style="font-size:18px;margin:0 0 6px">Precisão por área</h3>'+bars+'</div>'+
   (miss.length?'<div class="card soft" style="padding:20px;margin-top:16px"><h3 class="ttl" style="font-size:18px;margin:0 0 14px">Questões mais erradas</h3><div style="display:flex;flex-direction:column;gap:10px">'+missHtml+'</div></div>':"")+
   '<div class="row gap wrapf" style="margin-top:18px"><button class="btn btn-ghost" onclick="exportProgress()">Exportar progresso (JSON)</button><button class="btn btn-danger" onclick="resetExam()">Zerar histórico desta prova</button></div>'+
   '<p class="small muted" style="margin-top:16px">Histórico: '+ses.length+' simulado(s). Última atividade: '+fmtDT(ses[ses.length-1].dateISO)+'.</p>';
}
function resetExam(){if(confirm("Apagar todo o histórico desta certificação?")){clearSessions(state.examCode);render();}}
function exportProgress(){download("progresso-"+state.examCode+".json",JSON.stringify({profile:profile,exam:state.examCode,sessions:examSessions(state.examCode)},null,2));}

/* ---------------- admin ---------------- */
function adminV(){
  if(!adminUnlocked){
    return '<h2 class="ttl" style="font-size:24px;margin:0 0 14px">Modo administrador</h2>'+
     '<div class="card soft" style="padding:24px;max-width:420px"><p class="muted" style="margin-top:0;font-size:14px">Informe a senha para gerenciar certificações.</p>'+
     '<input id="admPass" class="in" type="password" style="width:100%;margin-bottom:14px" placeholder="Senha" onkeydown="if(event.key===\'Enter\')unlockAdmin()">'+
     '<button class="btn btn-pri" style="width:100%" onclick="unlockAdmin()">Entrar</button>'+
     (state.adminMsg?'<p class="small" style="color:var(--err);margin-bottom:0">'+esc(state.adminMsg)+'</p>':"")+'</div>';
  }
  var exRows=allExams().map(function(ex){var custom=customExams().some(function(c){return c.code===ex.code;});
    return '<div class="row between wrapf gap" style="padding:12px;border-bottom:1px solid var(--line)"><div><b>'+esc(ex.title)+'</b> <span class="small muted">'+esc(ex.code)+' · '+ex.questions.length+' questões</span> '+(custom?'<span class="badge" style="background:var(--rx)">Custom</span>':'<span class="badge" style="background:var(--mut)">Padrão</span>')+'</div>'+
    '<div class="row gap"><button class="btn btn-ghost small" style="padding:7px 12px" onclick="exportExam(\''+ex.code+'\')">Exportar</button>'+(custom?'<button class="btn btn-danger small" style="padding:7px 12px" onclick="deleteExam(\''+ex.code+'\')">Excluir</button>':'')+'</div></div>';
  }).join("");
  return '<div class="row between wrapf" style="margin-bottom:14px"><h2 class="ttl" style="font-size:24px;margin:0">Administrador</h2><button class="btn btn-ghost" onclick="adminUnlocked=false;render()">Sair do admin</button></div>'+
   '<div class="card soft" style="padding:8px 4px;margin-bottom:16px">'+exRows+'</div>'+
   '<div class="card soft" style="padding:20px;margin-bottom:16px"><h3 class="ttl" style="font-size:18px;margin:0 0 12px">Adicionar certificação (colar dump)</h3>'+
     '<div class="row gap wrapf" style="margin-bottom:10px"><input id="newTitle" class="in" style="flex:1;min-width:200px" placeholder="Título (ex.: SAP FI C_TS4FI)"><input id="newCode" class="in" style="width:200px" placeholder="Código (ex.: C_TS4FI_2023)"></div>'+
     '<textarea id="newDump" class="in" style="width:100%;height:200px;font-family:ui-monospace,monospace;font-size:12px" placeholder="Cole aqui o texto no formato:\nNO.1 Pergunta...\nA. opção\nB. opção\nAnswer: A\nNO.2 ..."></textarea>'+
     '<div class="row gap wrapf" style="margin-top:10px"><button class="btn btn-pri" onclick="addFromDump()">Processar e salvar</button>'+
     '<label class="btn btn-ghost" style="cursor:pointer">Importar (JSON)<input type="file" accept="application/json" style="display:none" onchange="importExam(this)"></label></div>'+
     (state.adminMsg?'<p class="small" style="margin-bottom:0;color:'+(state.adminMsg.indexOf("Erro")===0?"var(--err)":"var(--mg)")+'">'+esc(state.adminMsg)+'</p>':"")+
   '</div>'+
   '<p class="small muted">Observação: certificações adicionadas aqui ficam salvas neste navegador. Para que apareçam para todos os colegas de forma permanente, exporte o JSON e me envie para incluir no app publicado, ou migre para um backend compartilhado (Supabase).</p>';
}
function unlockAdmin(){var v=($("admPass").value||"");if(v===ADMIN_PASS){adminUnlocked=true;state.adminMsg="";}else{state.adminMsg="Senha incorreta.";}render();}
function parseDump(text){
  var noise=/^(IT Certification Guaranteed.*|Exam\s*:.*|Title\s*:.*|Vendor\s*:.*|Version\s*:.*)$/i;
  var parts=text.split(/(?=NO\.\d+\b)/),blocks={};
  parts.forEach(function(p){var m=p.match(/^NO\.(\d+)\b/);if(!m)return;var n=+m[1];if(!(n in blocks)||p.length>blocks[n].length)blocks[n]=p;});
  var out=[];Object.keys(blocks).map(Number).sort(function(a,b){return a-b;}).forEach(function(n){
    var lines=blocks[n].split(/\r?\n/).map(function(s){return s.trim();}).filter(function(s){return s&&!/^\d{1,3}$/.test(s)&&!noise.test(s);});
    if(!lines.length)return;lines[0]=lines[0].replace(/^NO\.\d+\s*/,"");
    var stem=[],opts={},cur=null,ans=null,mode="stem";
    lines.forEach(function(ln){var am=ln.match(/^Answer:\s*([A-Ea-e](?:\s*,\s*[A-Ea-e])*)/i);if(am){ans=am[1].split(",").map(function(x){return x.trim().toUpperCase();});mode="done";return;}if(mode==="done")return;var om=ln.match(/^([A-E])\.\s*(.*)$/);if(om&&(mode==="stem"||mode==="opt")){mode="opt";cur=om[1];opts[cur]=om[2].trim();return;}if(mode==="stem")stem.push(ln);else if(mode==="opt"&&cur)opts[cur]=(opts[cur]+" "+ln).trim();});
    var s=stem.join(" ").replace(/\(\s*\d\s*Correct Answer[s]?\s*\)/ig,"").replace(/Note:\s*There are \d+ correct answers to this question\.?/ig,"").replace(/\s*\b[1-5]\s*$/,"").replace(/\s{2,}/g," ").trim();
    if(s&&ans&&Object.keys(opts).length>=2)out.push({id:n,q:s,o:opts,a:ans,cat:"geral"});
  });
  return out;
}
function addFromDump(){
  var title=($("newTitle").value||"").trim(),code=($("newCode").value||"").trim().replace(/\s+/g,"_"),dump=$("newDump").value||"";
  if(!title||!code){state.adminMsg="Erro: informe título e código.";return render();}
  if(getExam(code)){state.adminMsg="Erro: já existe certificação com este código.";return render();}
  var qs=parseDump(dump);
  if(qs.length<1){state.adminMsg="Erro: nenhuma questão reconhecida. Verifique o formato (NO.x / A. / Answer:).";return render();}
  var exam={code:code,title:title,subtitle:qs.length+" questões (importado)",cats:{geral:{label:"Geral",color:"#009994"}},questions:qs};
  var cs=customExams();cs.push(exam);jset(CUSTOM_K,cs);
  state.adminMsg=qs.length+" questões importadas com sucesso em "+title+".";render();
}
function deleteExam(code){if(!confirm("Excluir esta certificação e seu histórico?"))return;jset(CUSTOM_K,customExams().filter(function(e){return e.code!==code;}));clearSessions(code);state.adminMsg="Certificação removida.";render();}
function exportExam(code){var ex=getExam(code);download(code+".json",JSON.stringify({code:ex.code,title:ex.title,subtitle:ex.subtitle,cats:ex.cats,questions:ex.questions},null,2));}
function importExam(input){var f=input.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);if(!o.code||!o.title||!Array.isArray(o.questions))throw 0;o.questions.forEach(function(q){if(!q.q||!q.o||!Array.isArray(q.a))throw 0;q.cat=q.cat||"geral";});if(!o.cats)o.cats={geral:{label:"Geral",color:"#009994"}};if(getExam(o.code)){state.adminMsg="Erro: código já existe.";return render();}var cs=customExams();cs.push(o);jset(CUSTOM_K,cs);state.adminMsg="Certificação "+o.title+" importada ("+o.questions.length+" questões).";render();}catch(e){state.adminMsg="Erro: arquivo JSON inválido.";render();}};r.readAsText(f);}

function download(name,text){var b=new Blob([text],{type:"application/json"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);}

render();

</script>
